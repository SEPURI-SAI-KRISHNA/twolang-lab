name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (regenerates content from INDEX.md + notebooks, then static-exports the site)
        run: npm run build

      - name: Sanity-check static export
        run: |
          test -f out/index.html
          echo "Static export produced $(find out -name '*.html' | wc -l) HTML pages."
